<body class="writeups-list-page reader-mode">

<main class="writeups-page-shell">
  <section id="writeupBrowser" class="writeups-browser" aria-label="Write-up browser">
    <div id="readerStage" class="writeup-reader-stage reader-active">
      <div id="writeupGrid" class="writeup-grid" aria-live="polite" hidden></div>

      <aside id="readerSidebar" class="reader-sidebar" aria-label="Write-up list">
        <div class="reader-controls">
          <div class="reader-sidebar-head">
            <span>WRITE-UPS</span>
          </div>
          <div class="reader-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="search" type="search" placeholder="Search write-ups..." aria-label="Search write-ups">
          </div>
          <div id="filters" class="filters" aria-label="Write-up tags"></div>
          <div class="reader-list-divider" aria-hidden="true"></div>
        </div>
        <div class="reader-list-label">WRITE-UPS</div>
        <div id="readerList" class="reader-list"></div>
      </aside>

      <article id="readerContent" class="reader-content">
        <div id="readerBody" class="reader-body"></div>
      </article>
    </div>
    <div id="empty" class="empty" hidden>No write-ups match your search.</div>
  </section>
</main>
